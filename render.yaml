services:
  - type: web
    name: ai-vaidya-backend
    runtime: docker
    rootDir: backend
    plan: starter
    healthCheckPath: /api/v1/health
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_MODEL
        value: llama3-70b-8192
      - key: EMBEDDING_MODEL
        value: sentence-transformers/all-MiniLM-L6-v2
      - key: EMBEDDING_BACKEND
        value: hash
      - key: CHROMA_PERSIST_DIR
        value: /app/chroma_db
      - key: UPLOAD_DIR
        value: /app/data/uploads
      - key: ALLOWED_ORIGINS
        value: https://ai-vaidya-frontend.onrender.com

  - type: web
    name: ai-vaidya-frontend
    runtime: docker
    rootDir: frontend
    plan: starter
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://ai-vaidya-backend.onrender.com/api/v1
      - key: BACKEND_URL
        value: https://ai-vaidya-backend.onrender.com/api/v1
